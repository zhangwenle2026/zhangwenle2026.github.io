<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="app-version" content="20260705-0237">
<meta name="theme-color" content="#e84040">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eric Talk">
<title>Eric Talk · 口语练习</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== Duolingo Visual Language Upgrade ===== */
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

:root{
  --primary:#ff4b4b;
  --primary-light:#ff7070;
  --primary-dark:#d63030;
  --primary-grad:linear-gradient(135deg,#ff4b4b,#ff8c42);
  --accent:#ff8c42;
  --accent2:#a259ff;
  --bg:#fff5f5;
  --card-bg:#ffffff;
  --text:#1a1a2e;
  --text-muted:#9b9bb4;
  --border:#ffe0e0;
  --star:#ffb300;
  --star-bg:#fff8e1;
  --done:#22c55e;
  --done-bg:#f0fdf4;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 4px 20px rgba(255,75,75,0.12);
  --shadow-hover:0 8px 30px rgba(255,75,75,0.22);
  --shadow-card:0 2px 12px rgba(0,0,0,0.07);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ===== HEADER ===== */
.app-header{
  background:var(--primary-grad);
  color:white;
  padding:16px 18px 0;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 16px rgba(255,75,75,0.35);
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.app-title{
  font-size:20px;font-weight:900;letter-spacing:0.5px;
  text-shadow:0 1px 4px rgba(0,0,0,0.15);
}
.app-title span{font-weight:400;opacity:0.85;font-size:13px;margin-left:6px}
.header-actions{display:flex;gap:8px}
.btn-icon{
  background:rgba(255,255,255,0.22);
  border:1.5px solid rgba(255,255,255,0.35);
  color:white;
  border-radius:20px;
  padding:6px 12px;
  font-size:12px;font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
  backdrop-filter:blur(4px);
}
.btn-icon:hover{background:rgba(255,255,255,0.35);transform:translateY(-1px)}
.btn-icon.active{
  background:white;
  color:var(--primary);
  border-color:white;
}

/* ===== TABS ===== */
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex:1;min-width:88px;
  padding:10px 8px 12px;
  background:none;border:none;
  color:rgba(255,255,255,0.65);
  font-size:12px;font-weight:700;
  font-family:'Nunito',sans-serif;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all 0.2s;white-space:nowrap;text-align:center;
  letter-spacing:0.2px;
}
.tab-btn.active{color:white;border-bottom-color:white;font-weight:900}

/* ===== SEARCH BAR ===== */
.search-bar{
  padding:14px 18px;
  background:var(--card-bg);
  border-bottom:1px solid var(--border);
}
.search-input{
  width:100%;padding:11px 18px;
  border:2px solid var(--border);
  border-radius:50px;
  font-size:14px;font-weight:600;
  font-family:'Nunito',sans-serif;
  outline:none;background:var(--bg);color:var(--text);
  transition:all 0.25s;
}
.search-input:focus{
  border-color:var(--primary-light);
  background:white;
  box-shadow:0 0 0 4px rgba(255,75,75,0.1);
}

/* ===== SCENE FILTER ===== */
.scene-filter{
  padding:12px 18px;
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  background:var(--card-bg);
  border-bottom:1px solid var(--border);
}
.scene-filter::-webkit-scrollbar{display:none}
.scene-btn{
  flex-shrink:0;
  padding:6px 14px;
  border-radius:50px;
  border:2px solid var(--border);
  background:var(--bg);
  color:var(--text-muted);
  font-size:12px;font-weight:700;
  font-family:'Nunito',sans-serif;
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.scene-btn:hover{border-color:var(--primary-light);color:var(--primary)}
.scene-btn.active{
  background:var(--primary);border-color:var(--primary);
  color:white;font-weight:800;
  box-shadow:0 3px 10px rgba(255,75,75,0.3);
  transform:translateY(-1px);
}

/* ===== DASHBOARD ===== */
.dashboard{
  padding:14px 18px;
  background:var(--card-bg);
  border-bottom:1px solid var(--border);
  display:flex;gap:14px;align-items:center;
}
.dash-stat{display:flex;flex-direction:column;align-items:center;flex:1}
.dash-num{
  font-size:24px;font-weight:900;color:var(--primary);
  line-height:1;
}
.dash-label{font-size:10px;font-weight:700;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}
.dash-bar{flex:2;height:12px;background:var(--border);border-radius:6px;overflow:hidden}
.dash-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:6px;transition:width 0.5s cubic-bezier(.22,.68,0,1.2);
}

/* ===== CARDS ===== */
.cards-container{padding:14px 18px 90px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card-wrap{min-width:0;overflow:hidden;box-sizing:border-box}

.flip-card{width:100%;aspect-ratio:1.15/1;perspective:1000px;cursor:pointer}
.flip-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform 0.45s cubic-bezier(.22,.68,0,1.2);
}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}

.flip-front,.flip-back{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px;
}
.flip-front{
  background:var(--card-bg);
  border:2px solid var(--border);
  box-shadow:var(--shadow-card);
  transition:box-shadow 0.25s,transform 0.25s,border-color 0.25s;
}
.flip-front:hover{
  box-shadow:var(--shadow-hover);
  transform:translateY(-3px);
  border-color:var(--primary-light);
}
.flip-back{
  background:var(--primary-grad);
  color:white;
  transform:rotateY(180deg);
  box-shadow:var(--shadow);
}

.card-cn{
  font-size:13px;font-weight:700;
  text-align:center;color:var(--text);line-height:1.45;
}
.card-scene-tag{
  font-size:10px;font-weight:700;
  color:var(--primary);margin-top:7px;
  background:rgba(255,75,75,0.08);
  padding:3px 9px;border-radius:20px;
  border:1px solid rgba(255,75,75,0.15);
}
.card-en{
  font-size:12px;font-weight:700;
  text-align:center;line-height:1.55;word-break:break-word;
}
.card-hint{font-size:10px;opacity:0.8;margin-top:5px;text-align:center;font-style:italic}

.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
.card-action-btn{
  width:26px;height:26px;border:none;border-radius:50%;
  cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
  background:rgba(255,255,255,0.9);
  opacity:0.55;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
}
.card-action-btn:hover{opacity:1;transform:scale(1.2)}
.card-action-btn.tagged-star{
  background:var(--star-bg);color:var(--star);
  border:1.5px solid var(--star);opacity:1;
}
.card-action-btn.tagged-done{
  background:var(--done-bg);color:var(--done);
  border:1.5px solid var(--done);opacity:1;
}
.flip-back .card-action-btn{background:rgba(255,255,255,0.25);color:white}
.flip-back .card-action-btn.tagged-star{background:var(--star);color:white;border:none}
.flip-back .card-action-btn.tagged-done{background:var(--done);color:white;border:none}

.speak-btn-front{
  position:absolute;bottom:8px;right:8px;
  width:28px;height:28px;border:none;border-radius:50%;
  background:rgba(255,75,75,0.1);
  color:var(--primary);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;z-index:2;
}
.speak-btn-front:hover{
  background:var(--primary);color:white;
  transform:scale(1.15);
  box-shadow:0 3px 10px rgba(255,75,75,0.35);
}
.flip-back .speak-btn-front{background:rgba(255,255,255,0.2);color:white}
.flip-back .speak-btn-front:hover{background:rgba(255,255,255,0.4)}

/* ===== LISTEN MODE ===== */
body.listen-mode .flip-front .card-cn{filter:blur(4px);user-select:none}
body.listen-mode .flip-back .card-en{filter:blur(4px);user-select:none}
body.listen-mode .flip-card.flipped .card-en{filter:none}

/* ===== TAB PANELS ===== */
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ===== TOPICS ===== */
.topics-list{padding:14px 18px 90px;display:flex;flex-direction:column;gap:16px}
.topic-card{
  background:var(--card-bg);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow-card);
  border:2px solid var(--border);
  transition:box-shadow 0.25s,transform 0.25s;
}
.topic-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.topic-date{
  font-size:10px;font-weight:800;
  color:var(--text-muted);margin-bottom:7px;
  text-transform:uppercase;letter-spacing:0.8px;
}
.topic-title{
  font-size:17px;font-weight:900;
  color:var(--primary);margin-bottom:10px;line-height:1.4;
}
.topic-body{font-size:14px;line-height:1.85;color:var(--text);font-weight:500}
.topic-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.topic-btn{
  padding:9px 20px;border-radius:50px;border:none;
  cursor:pointer;font-size:13px;font-weight:800;
  font-family:'Nunito',sans-serif;
  transition:all 0.2s;
}
.topic-btn-speak{
  background:var(--primary-grad);color:white;
  box-shadow:0 3px 12px rgba(255,75,75,0.3);
}
.topic-btn-speak:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,75,75,0.4)}
.topic-btn-copy{
  background:var(--bg);color:var(--text);
  border:2px solid var(--border);
}
.topic-btn-copy:hover{border-color:var(--primary-light);color:var(--primary)}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:70px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:50px;margin-bottom:14px;display:block}
.empty-state p{font-size:15px;font-weight:600}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:90px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,#1a1a2e,#2d2d50);
  color:white;padding:11px 22px;
  border-radius:50px;font-size:13px;font-weight:700;
  opacity:0;transition:all 0.3s cubic-bezier(.22,.68,0,1.2);
  z-index:999;pointer-events:none;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,0,0,0.25);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== ANIMATIONS ===== */
@keyframes pulse-speak{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.speaking{animation:pulse-speak 0.55s infinite}

@keyframes card-pop{
  0%{transform:scale(0.92);opacity:0}
  70%{transform:scale(1.03)}
  100%{transform:scale(1);opacity:1}
}
.card-pop{animation:card-pop 0.3s ease forwards}

/* ===== DONE STATE INDICATOR ===== */
.card-wrap.is-done .flip-front{
  border-color:var(--done);
  background:var(--done-bg);
}
.card-wrap.is-star .flip-front{
  border-color:var(--star);
  background:var(--star-bg);
}

/* ===== RESPONSIVE ===== */
@media(min-width:600px){
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}
  .app-title{font-size:22px}
}
@media(min-width:900px){
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div class="app-title">🗣️ Eric Talk <span>· 口语练习</span></div>
    <div class="header-actions">
      <button class="btn-icon" id="btnListen" onclick="toggleListenMode()">👂 听力</button>
      <button class="btn-icon" id="btnStarOnly" onclick="toggleStarFilter()">⭐ 重要</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(0)">🌞 日常口语</button>

    <button class="tab-btn" onclick="switchTab(2)">💼 职场英语</button>
    <button class="tab-btn" onclick="switchTab(3)">📖 每日话题</button>
  </div>
</div>

<div class="tab-panel active" id="panel-0">
  <div class="search-bar"><input type="search" class="search-input" id="search-0" placeholder="🔍 搜索日常口语..." oninput="filterCards(0)"></div>
  <div class="scene-filter" id="scene-filter-0"></div>
  <div class="dashboard">
    <div class="dash-stat"><div class="dash-num" id="dash-total-0">0</div><div class="dash-label">总计</div></div>
    <div class="dash-stat"><div class="dash-num" id="dash-done-0" style="color:var(--done)">0</div><div class="dash-label">已掌握</div></div>
    <div class="dash-stat"><div class="dash-num" id="dash-star-0" style="color:var(--star)">0</div><div class="dash-label">重要</div></div>

</div>

  <div class="search-bar"><input type="search" class="search-input" id="search-1" placeholder="🔍 搜索生活高频..." oninput="filterCards(1)"></div>
  <div class="scene-filter" id="scene-filter-1"></div>
  <div class="dashboard">
    <div class="dash-stat"><div class="dash-num" id="dash-total-1">0</div><div class="dash-label">总计</div></div>
    <div class="dash-stat"><div class="dash-num" id="dash-done-1" style="color:var(--done)">0</div><div class="dash-label">已掌握</div></div>
    <div class="dash-stat"><div class="dash-num" id="dash-star-1" style="color:var(--star)">0</div><div class="dash-label">重要</div></div>
    <div class="dash-bar"><div class="dash-bar-fill" id="dash-bar-1" style="width:0%"></div></div>
  </div>
  <div class="cards-container"><div class="cards-grid" id="grid-1"></div><div class="empty-state" id="empty-1" style="display:none"><div class="empty-icon">🔍</div><p>没有找到匹配的内容</p></div></div>
</div>

<div class="tab-panel" id="panel-2">
  <div class="search-bar"><input type="search" class="search-input" id="search-2" placeholder="🔍 搜索职场英语..." oninput="filterCards(2)"></div>
  <div class="scene-filter" id="scene-filter-2"></div>
  <div class="dashboard">
    <div class="dash-stat"><div class="dash-num" id="dash-total-2">0</div><div class="dash-label">总计</div></div>
    <div class="dash-stat"><div class="dash-num" id="dash-done-2" style="color:var(--done)">0</div><div class="dash-label">已掌握</div></div>
    <div class="dash-stat"><div class="dash-num" id="dash-star-2" style="color:var(--star)">0</div><div class="dash-label">重要</div></div>

  </div>
  <div class="cards-container"><div class="cards-grid" id="grid-2"></div><div class="empty-state" id="empty-2" style="display:none"><div class="empty-icon">🔍</div><p>没有找到匹配的内容</p></div></div>
</div>

<div class="tab-panel" id="panel-3">
  <div class="topics-list" id="topics-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// SPEECH ENGINE v3.2
// ============================================================
// SPEECH ENGINE v3.2 — full-text utterance with boundary tracking
// Natural: entire text in one speak() call
// Seek: cancel + re-speak from target word onward
// Pause: cancel + remember word position, resume from there
// ============================================================
(function(){
var SE = window.SpeechEngine = {
  rate: 1.0,
  loop: false,

  _words: [],
  _cid: null,
  _wordIdx: 0,       // current word index (tracked via boundary/timer)
  _playing: false,
  _paused: false,
  _pausedAtIdx: 0,
  _utt: null,
  _timerHandle: null,

  speak: function(containerId, startWordIdx) {
    SE.stop();
    if (!window.speechSynthesis) return;
    var el = document.getElementById(containerId + '-text');
    if (!el) return;
    var fullText = (el.dataset.fulltext || el.textContent).trim();
    SE._words = fullText.split(/\s+/);
    SE._cid = containerId;
    SE._playing = true;
    SE._paused = false;
    startWordIdx = startWordIdx || 0;
    SE._wordIdx = startWordIdx;

    SE._updateBtn(containerId, true);
    SE._updateRateBtns(containerId);
    SE._speakFrom(startWordIdx);
  },

  _speakFrom: function(fromIdx) {
    if (!SE._playing) return;
    window.speechSynthesis.cancel();
    if (SE._timerHandle) { clearInterval(SE._timerHandle); SE._timerHandle = null; }

    var textToSpeak = SE._words.slice(fromIdx).join(' ');
    if (!textToSpeak) {
      SE._onFinish();
      return;
    }

    var utt = new SpeechSynthesisUtterance(textToSpeak);
    utt.lang = 'en-US';
    utt.rate = SE.rate;
    SE._utt = utt;
    SE._wordIdx = fromIdx;

    // Use boundary event for accurate word tracking
    var wordsInSegment = SE._words.length - fromIdx;
    var boundarySupported = false;

    utt.onboundary = function(e) {
      if (e.name === 'word' && SE._playing && !SE._paused) {
        boundarySupported = true;
        // charIndex is relative to textToSpeak
        // Count words by splitting up to charIndex
        var spoken = textToSpeak.substring(0, e.charIndex);
        var wordCount = spoken ? spoken.trim().split(/\s+/).length : 0;
        SE._wordIdx = fromIdx + wordCount;
        SE._highlightWord(SE._wordIdx);
        SE._updateProgress(SE._wordIdx / SE._words.length);
      }
    };

    // Fallback timer-based tracking if boundary not supported
    utt.onstart = function() {
      if (!boundarySupported) {
        var estMs = (wordsInSegment / 150) * 60000 / SE.rate;
        var msPerWord = estMs / wordsInSegment;
        var startTime = Date.now();
        SE._timerHandle = setInterval(function() {
          if (!SE._playing || SE._paused || boundarySupported) {
            clearInterval(SE._timerHandle); SE._timerHandle = null;
            return;
          }
          var elapsed = Date.now() - startTime;
          var wi = Math.min(fromIdx + Math.floor(elapsed / msPerWord), SE._words.length - 1);
          if (wi !== SE._wordIdx) {
            SE._wordIdx = wi;
            SE._highlightWord(wi);
            SE._updateProgress(wi / SE._words.length);
          }
        }, 100);
      }
    };

    utt.onend = function() {
      if (SE._timerHandle) { clearInterval(SE._timerHandle); SE._timerHandle = null; }
      if (!SE._playing || SE._paused) return;
      SE._onFinish();
    };

    utt.onerror = function(e) {
      if (SE._timerHandle) { clearInterval(SE._timerHandle); SE._timerHandle = null; }
      if (e.error === 'canceled' || e.error === 'interrupted') return;
      if (!SE._playing || SE._paused) return;
      SE._onFinish();
    };

    window.speechSynthesis.speak(utt);
  },

  _onFinish: function() {
    if (SE.loop && SE._cid) {
      SE._wordIdx = 0;
      SE._updateProgress(0);
      SE._clearHighlight();
      setTimeout(function() {
        if (SE._playing && !SE._paused) SE._speakFrom(0);
      }, 400);
    } else {
      SE._playing = false;
      SE._updateBtn(SE._cid, false);
      SE._updateProgress(1);
      SE._clearHighlight();
      SE._utt = null;
    }
  },

  pause: function() {
    if (!SE._playing || SE._paused) return;
    SE._paused = true;
    SE._pausedAtIdx = SE._wordIdx;
    window.speechSynthesis.cancel();
    if (SE._timerHandle) { clearInterval(SE._timerHandle); SE._timerHandle = null; }
    SE._updatePauseBtn();
  },

  resume: function() {
    if (!SE._playing || !SE._paused) return;
    SE._paused = false;
    SE._updatePauseBtn();
    SE._speakFrom(SE._pausedAtIdx);
  },

  togglePause: function() {
    if (SE._paused) SE.resume(); else SE.pause();
  },

  stop: function() {
    SE._playing = false;
    SE._paused = false;
    window.speechSynthesis.cancel();
    if (SE._timerHandle) { clearInterval(SE._timerHandle); SE._timerHandle = null; }
    if (SE._cid) {
      SE._updateBtn(SE._cid, false);
      SE._updateProgress(0);
      SE._clearHighlight();
    }
    SE._cid = null;
    SE._wordIdx = 0;
    SE._words = [];
    SE._utt = null;
  },

  seekTo: function(pct, containerId) {
    var el = document.getElementById(containerId + '-text');
    if (!el) return;
    var allWords = (el.dataset.fulltext || el.textContent).trim().split(/\s+/);
    var targetIdx = Math.max(0, Math.min(Math.floor(pct * allWords.length), allWords.length - 1));

    if (SE._playing && SE._cid === containerId) {
      window.speechSynthesis.cancel();
      if (SE._timerHandle) { clearInterval(SE._timerHandle); SE._timerHandle = null; }
      SE._paused = false;
      SE._wordIdx = targetIdx;
      SE._speakFrom(targetIdx);
    } else {
      SE.speak(containerId, targetIdx);
    }
  },

  toggleLoop: function(containerId) {
    SE.loop = !SE.loop;
    document.querySelectorAll('.se-loop-btn').forEach(function(btn) {
      btn.classList.toggle('se-loop-active', SE.loop && btn.id === containerId + '-loop-btn');
    });
    if (SE.loop && (!SE._playing || SE._cid !== containerId)) {
      SE.stop();
      SE.speak(containerId, 0);
    }
  },

  setRate: function(r, containerId) {
    SE.rate = r;
    SE._updateRateBtns(containerId);
    if (SE._playing && SE._cid === containerId && !SE._paused) {
      // Restart from current word with new rate
      var curIdx = SE._wordIdx;
      window.speechSynthesis.cancel();
      if (SE._timerHandle) { clearInterval(SE._timerHandle); SE._timerHandle = null; }
      SE._speakFrom(curIdx);
    }
  },

  _togglePlay: function(containerId) {
    if (SE._playing && SE._cid === containerId) {
      SE.loop = false;
      document.querySelectorAll('.se-loop-btn').forEach(function(b){ b.classList.remove('se-loop-active'); });
      SE.stop();
    } else {
      SE.stop();
      SE.speak(containerId, 0);
    }
  },

  // ---- UI ----
  _highlightWord: function(idx) {
    if (!SE._cid) return;
    var container = document.getElementById(SE._cid + '-text');
    if (!container) return;
    container.querySelectorAll('.se-word').forEach(function(s, i) {
      s.classList.toggle('se-word-active', i === idx);
    });
  },

  _clearHighlight: function() {
    if (!SE._cid) return;
    var container = document.getElementById(SE._cid + '-text');
    if (!container) return;
    container.querySelectorAll('.se-word').forEach(function(s){ s.classList.remove('se-word-active'); });
  },

  _updateProgress: function(pct) {
    if (!SE._cid) return;
    var fill = document.getElementById(SE._cid + '-prog-fill');
    var thumb = document.getElementById(SE._cid + '-prog-thumb');
    var pct100 = Math.round(Math.min(1, Math.max(0, pct)) * 100);
    if (fill) fill.style.width = pct100 + '%';
    if (thumb) thumb.style.left = pct100 + '%';
  },

  _updateBtn: function(cid, playing) {
    var btn = document.getElementById(cid + '-play-btn');
    if (!btn) return;
    btn.textContent = playing ? '⏹ 停止' : '🔈 朗读';
    btn.classList.toggle('se-playing', playing);
    SE._updatePauseBtn();
  },

  _updatePauseBtn: function() {
    if (!SE._cid) return;
    var btn = document.getElementById(SE._cid + '-pause-btn');
    if (!btn) return;
    btn.textContent = SE._paused ? '▶' : '⏸';
    btn.style.display = SE._playing ? 'inline-block' : 'none';
  },

  _updateRateBtns: function(cid) {
    if (!cid) return;
    [0.6, 1.0, 1.3].forEach(function(r) {
      var btn = document.getElementById(cid + '-rate-' + r.toString().replace('.',''));
      if (btn) btn.classList.toggle('se-rate-active', SE.rate === r);
    });
  },

  // ---- DOM builders ----
  buildWordSpans: function(text, containerId) {
    var words = text.trim().split(/\s+/);
    return '<span id="' + containerId + '-text" class="se-text-wrap" data-fulltext="' + text.replace(/"/g,'&quot;') + '">' +
      words.map(function(w) {
        return '<span class="se-word">' + w.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span>';
      }).join(' ') + '</span>';
  },

  buildPlayer: function(containerId) {
    return '<div class="se-player" id="' + containerId + '-player">' +
      '<button id="' + containerId + '-play-btn" class="se-play-btn" onclick="SpeechEngine._togglePlay(\'' + containerId + '\')">🔈 朗读</button>' +
      '<button id="' + containerId + '-pause-btn" class="se-rate-btn" style="display:none;font-size:13px;padding:4px 10px" onclick="SpeechEngine.togglePause()">⏸</button>' +
      '<button id="' + containerId + '-loop-btn" class="se-loop-btn se-rate-btn" title="循环" onclick="SpeechEngine.toggleLoop(\'' + containerId + '\')">🔁</button>' +
      '<span class="se-rate-group">' +
        '<button id="' + containerId + '-rate-06" class="se-rate-btn" onclick="SpeechEngine.setRate(0.6,\'' + containerId + '\')">慢</button>' +
        '<button id="' + containerId + '-rate-10" class="se-rate-btn se-rate-active" onclick="SpeechEngine.setRate(1.0,\'' + containerId + '\')">正常</button>' +
        '<button id="' + containerId + '-rate-13" class="se-rate-btn" onclick="SpeechEngine.setRate(1.3,\'' + containerId + '\')">快</button>' +
      '</span>' +
      '<div class="se-progress-wrap" id="' + containerId + '-prog">' +
        '<div class="se-progress-fill" id="' + containerId + '-prog-fill"></div>' +
        '<div class="se-progress-thumb" id="' + containerId + '-prog-thumb"' +
        ' onmousedown="SpeechEngine._startDrag(event,\'' + containerId + '\')"' +
        ' ontouchstart="SpeechEngine._startDrag(event,\'' + containerId + '\')"></div>' +
      '</div>' +
    '</div>';
  },

  _startDrag: function(e, containerId) {
    e.preventDefault(); e.stopPropagation();
    var bar = document.getElementById(containerId + '-prog');
    if (!bar) return;

    var wasPlaying = SE._playing && SE._cid === containerId;
    if (wasPlaying) {
      window.speechSynthesis.cancel();
      if (SE._timerHandle) { clearInterval(SE._timerHandle); SE._timerHandle = null; }
      SE._paused = true;
    }

    function getPct(clientX) {
      var rect = bar.getBoundingClientRect();
      return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    }

    function move(ev) {
      var cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      var pct = getPct(cx);
      var fill = document.getElementById(containerId + '-prog-fill');
      var thumb = document.getElementById(containerId + '-prog-thumb');
      if (fill) fill.style.width = Math.round(pct*100) + '%';
      if (thumb) thumb.style.left = Math.round(pct*100) + '%';
      var el = document.getElementById(containerId + '-text');
      if (el) {
        var ws = (el.dataset.fulltext || el.textContent).trim().split(/\s+/);
        var wi = Math.min(Math.floor(pct * ws.length), ws.length - 1);
        el.querySelectorAll('.se-word').forEach(function(s,i){ s.classList.toggle('se-word-active', i === wi); });
      }
    }

    function up(ev) {
      var cx = ev.changedTouches ? ev.changedTouches[0].clientX : ev.clientX;
      var pct = getPct(cx);
      SE._paused = false;
      SE.seekTo(pct, containerId);
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
    }

    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', move, {passive:false});
    document.addEventListener('touchend', up);
  }
};

var currentTab = 0;
var listenMode = false;
var starOnly = false;
var sceneFilters = {0: '', 1: '', 2: ''};
var tagStates = loadState('tags');  // {id: 'star'|'done'|''}
var deletedIds = loadState('deleted');  // {id: true}

function getCardId(item, index) {
  return 't' + item.tab + '_' + index;
}

// ============================================================
// Render
// ============================================================
function getTabData(tab) {
  return DATA.filter(function(d, i) {
    return d.tab === tab && !deletedIds[getCardId(d, DATA.indexOf(d))];
  });
}

function getScenes(tab) {
  var scenes = [];
  var seen = {};
  DATA.forEach(function(d) {
    if (d.tab === tab && !seen[d.scene]) {
      seen[d.scene] = true;
      scenes.push(d.scene);
    }
  });
  return scenes;
}

function renderSceneFilter(tab) {
  var el = document.getElementById('scene-filter-' + tab);
  if (!el) return;
  var scenes = getScenes(tab);
  var html = '<button class="scene-btn' + (sceneFilters[tab] === '' ? ' active' : '') + '" onclick="setScene(' + tab + ', \'\')">全部</button>';
  scenes.forEach(function(s) {
    html += '<button class="scene-btn' + (sceneFilters[tab] === s ? ' active' : '') + '" onclick="setScene(' + tab + ', \'' + s.replace(/'/g, "\\'") + '\')">' + s + '</button>';
  });
  el.innerHTML = html;
}

function setScene(tab, scene) {
  sceneFilters[tab] = scene;
  renderSceneFilter(tab);
  filterCards(tab);
}

function filterCards(tab) {
  var query = (document.getElementById('search-' + tab) || {value:''}).value.toLowerCase();
  var scene = sceneFilters[tab] || '';
  var grid = document.getElementById('grid-' + tab);
  var empty = document.getElementById('empty-' + tab);
  if (!grid) return;
  var cards = grid.querySelectorAll('.card-wrap');
  var visible = 0;
  cards.forEach(function(wrap) {
    var cn = (wrap.dataset.cn || '').toLowerCase();
    var en = (wrap.dataset.en || '').toLowerCase();
    var sc = wrap.dataset.scene || '';
    var id = wrap.dataset.id;
    var tag = tagStates[id] || '';
    var matchQuery = !query || cn.includes(query) || en.includes(query);
    var matchScene = !scene || sc === scene;
    var matchStar = !starOnly || tag === 'star';
    if (matchQuery && matchScene && matchStar) {
      wrap.style.display = '';
      visible++;
    } else {
      wrap.style.display = 'none';
    }
  });
  if (empty) empty.style.display = visible === 0 ? '' : 'none';
  updateDash(tab);
}

function renderCards(tab) {
  var grid = document.getElementById('grid-' + tab);
  if (!grid) return;
  var html = '';
  DATA.forEach(function(d, i) {
    if (d.tab !== tab) return;
    var id = getCardId(d, i);
    if (deletedIds[id]) return;
    var tag = tagStates[id] || '';
    html += renderCard(d, i, id, tag);
  });
  grid.innerHTML = html;
  renderSceneFilter(tab);
  filterCards(tab);
  updateDash(tab);
}

function renderCard(d, i, id, tag) {
  var starClass = tag === 'star' ? ' tagged-star' : '';
  var doneClass = tag === 'done' ? ' tagged-done' : '';
  var cid = 'se-card-' + id;
  var wordSpans = SpeechEngine.buildWordSpans(d.en, cid);
  var player = SpeechEngine.buildPlayer(cid, d.en);
  return '<div class="card-wrap" data-id="' + id + '" data-cn="' + escHtml(d.cn) + '" data-en="' + escHtml(d.en) + '" data-scene="' + escHtml(d.scene) + '">' +
    '<div class="flip-card" id="card-' + id + '" onclick="flipCard(\'' + id + '\')">' +
      '<div class="flip-inner">' +
        '<div class="flip-front">' +
          '<div class="card-actions">' +
            '<button class="card-action-btn' + starClass + '" onclick="tagCard(event,\'' + id + '\',\'star\')" title="重要">⭐</button>' +
            '<button class="card-action-btn' + doneClass + '" onclick="tagCard(event,\'' + id + '\',\'done\')" title="掌握">✅</button>' +
            '<button class="card-action-btn" onclick="deleteCard(event,\'' + id + '\')" title="删除">🗑</button>' +
          '</div>' +
          '<div class="card-cn">' + escHtml(d.cn) + '</div>' +
          '<div class="card-scene-tag">' + escHtml(d.scene) + '</div>' +
        '</div>' +
        '<div class="flip-back" onclick="event.stopPropagation()">' +
          '<div class="card-actions">' +
            '<button class="card-action-btn' + starClass + '" onclick="tagCard(event,\'' + id + '\',\'star\')" title="重要">⭐</button>' +
            '<button class="card-action-btn' + doneClass + '" onclick="tagCard(event,\'' + id + '\',\'done\')" title="掌握">✅</button>' +
          '</div>' +
          '<div class="card-en">' + wordSpans + '</div>' +
          player +
          '<div class="card-hint" style="margin-top:8px">点击翻回</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function updateDash(tab) {
  var items = DATA.filter(function(d, i) { return d.tab === tab && !deletedIds[getCardId(d, i)]; });
  var total = items.length;
  var done = items.filter(function(d, i) {
    var idx = DATA.indexOf(d);
    return tagStates[getCardId(d, idx)] === 'done';
  }).length;
  var star = items.filter(function(d, i) {
    var idx = DATA.indexOf(d);
    return tagStates[getCardId(d, idx)] === 'star';
  }).length;
  var pct = total > 0 ? Math.round(done / total * 100) : 0;
  var tEl = document.getElementById('dash-total-' + tab);
  var dEl = document.getElementById('dash-done-' + tab);
  var sEl = document.getElementById('dash-star-' + tab);
  var bEl = document.getElementById('dash-bar-' + tab);
  if (tEl) tEl.textContent = total;
  if (dEl) dEl.textContent = done;
  if (sEl) sEl.textContent = star;
  if (bEl) bEl.style.width = pct + '%';
}

function renderTopics() {
  var list = document.getElementById('topics-list');
  if (!list) return;
  var html = '';
  TOPICS.forEach(function(t, i) {
    var cid = 'se-topic-' + i;
    var cnBlock = t.cn ? '<div class="topic-cn" style="font-size:13px;line-height:1.85;color:#888;margin-bottom:10px;padding:10px 12px;background:#fff5f5;border-radius:10px;border-left:3px solid #ff4b4b;">' + escHtml(t.cn) + '</div>' : '';
    html += '<div class="topic-card">' +
      '<div class="topic-date">📅 ' + t.date + '</div>' +
      '<div class="topic-title">' + escHtml(t.title) + '</div>' +
      cnBlock +
      '<div class="topic-body" id="topic-body-' + i + '" style="font-size:14px;line-height:2;font-weight:500">' + SpeechEngine.buildWordSpans(t.body, cid) + '</div>' +
      SpeechEngine.buildPlayer(cid, t.body) +
      '<div class="topic-actions" style="margin-top:8px">' +
        '<button class="topic-btn topic-btn-copy" onclick="copyTopic(' + i + ')">📋 复制</button>' +
      '</div>' +
    '</div>';
  });
  list.innerHTML = html;
}

// Actions
// ============================================================
function flipCard(id) {
  var el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('flipped');
}

function tagCard(e, id, type) {
  e.stopPropagation();
  var cur = tagStates[id] || '';
  var newTag = (cur === type) ? '' : type;
  tagStates[id] = newTag;
  saveState('tags', tagStates);
  // Update all matching cards (front and back)
  var allWraps = document.querySelectorAll('[data-id="' + id + '"]');
  allWraps.forEach(function(wrap) {
    var starBtns = wrap.querySelectorAll('.card-action-btn');
    starBtns.forEach(function(btn) {
      btn.classList.remove('tagged-star', 'tagged-done');
    });
    if (newTag === 'star') {
      wrap.querySelectorAll('.card-action-btn:first-child').forEach(function(b) { b.classList.add('tagged-star'); });
    } else if (newTag === 'done') {
      wrap.querySelectorAll('.card-action-btn:nth-child(2)').forEach(function(b) { b.classList.add('tagged-done'); });
    }
  });
  updateDash(currentTab);
  if (newTag === 'done') showToast('✅ 已标记为掌握');
  else if (newTag === 'star') showToast('⭐ 已标记为重要');
  else showToast('标记已取消');
}

function deleteCard(e, id) {
  e.stopPropagation();
  deletedIds[id] = true;
  saveState('deleted', deletedIds);
  var wrap = document.querySelector('[data-id="' + id + '"]');
  if (wrap) wrap.remove();
  updateDash(currentTab);
  showToast('🗑 已删除');
}

// speakText removed — using SpeechEngine directly

// speakTopic removed — using SpeechEngine directly

function copyTopic(i) {
  var t = TOPICS[i];
  var text = t.title + '\n\n' + t.body;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { showToast('📋 已复制到剪贴板'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('📋 已复制到剪贴板');
  }
}

function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab-btn').forEach(function(b, i) {
    b.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.tab-panel').forEach(function(p, i) {
    p.classList.toggle('active', i === idx);
  });
  if (idx < 3) filterCards(idx);
}

function toggleListenMode() {
  listenMode = !listenMode;
  document.body.classList.toggle('listen-mode', listenMode);
  var btn = document.getElementById('btnListen');
  if (btn) btn.classList.toggle('active', listenMode);
  showToast(listenMode ? '👂 听力模式已开启' : '👁 听力模式已关闭');
}

function toggleStarFilter() {
  starOnly = !starOnly;
  var btn = document.getElementById('btnStarOnly');
  if (btn) btn.classList.toggle('active', starOnly);
  for (var t = 0; t < 3; t++) filterCards(t);
  showToast(starOnly ? '⭐ 只显示重要词句' : '全部词句');
}

// ============================================================
// Toast
// ============================================================
var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
}

// ============================================================
// Utils
// ============================================================
function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escJs(s) {
  return (s || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}

// Init
// ============================================================
renderCards(0);
renderCards(1);
renderCards(2);
renderTopics();

// PWA service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
